<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IPTV playlist</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f4;
        color: #202124;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100% - 32px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 7vw, 56px);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 24px;
        max-width: 620px;
        color: #4b5563;
        font-size: 18px;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 8px;
        background: #1769aa;
        color: #fff;
        font-weight: 650;
        text-decoration: none;
      }

      code {
        display: block;
        margin-top: 20px;
        overflow-wrap: anywhere;
        color: #374151;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #111315;
          color: #f2f4f8;
        }

        p,
        code {
          color: #c3cad5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>IPTV playlist</h1>
      <p>Личный M3U-плейлист для Smart TV. Добавьте ссылку ниже в IPTV-приложение на телевизоре.</p>
      <a href="./playlist.m3u">Открыть playlist.m3u</a>
      <code id="playlist-url"></code>
    </main>
    <script>
      const playlistUrl = new URL("playlist.m3u", window.location.href);
      document.getElementById("playlist-url").textContent = playlistUrl.href;
    </script>
  </body>
</html>
